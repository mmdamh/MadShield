name: Build MadShield APK

# Everything is built from SOURCE in this workflow, on GitHub's own runners --
# no prebuilt aether/hev-socks5-tunnel binaries are ever downloaded and
# trusted blindly. Both engines are fetched by exact pinned commit hash; bump the pin
# deliberately (native/*.pin) instead of tracking "latest" so a
# malicious upstream push can't silently land in your next build.
#
# The aether-core build job below is verified against CluvexStudio/Aether's
# own .github/workflows/release.yml "android" job (checked directly against
# the v1.5.0 source on 2026-08-03), not guessed -- same Go/CMake/NDK/cargo-ndk
# recipe they use to publish their own android-arm64/armv7 releases. Only
# arm64-v8a and armeabi-v7a are built -- matches the reference app's own ABI
# set, which covers virtually every real Android phone (x86_64 mainly
# matters for emulators, and skipping it halves native build time).
# The hev-socks5-tunnel job builds our OWN JNI bridge (scripts/aethertun-jni.c)
# instead of relying on hev's bundled JNI layer, which has drifted across
# upstream versions before and crashed full VPN mode while leaving proxy-only
# mode working. hev's own JNI layer is stripped from the build; symbol names
# on both libraries are verified at build time (llvm-nm), not assumed.

on:
  workflow_dispatch:
  push:
    branches: [main]

# Least privilege: nothing in this workflow may write to the repository, except the separate
# "release" job at the end, which is the only one with contents: write and has no signing key.
permissions:
  contents: read

jobs:
  # Pure-Kotlin unit tests (policies, parsers, env builder). Deliberately NOT a dependency of the build jobs:
  # a failing test shows up as a red job here but never blocks an APK, so you can still ship while you look.
  pure-tests:
    name: Pure Kotlin tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install kotlinc 1.9.24
        run: |
          set -e
          curl -fsSL -o /tmp/kotlinc.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.24/kotlin-compiler-1.9.24.zip
          unzip -q /tmp/kotlinc.zip -d /tmp
          echo "KOTLINC=/tmp/kotlinc/bin/kotlinc" >> "$GITHUB_ENV"
      - name: Run tests
        run: bash scripts/run-pure-tests.sh

  build-native-aether:
    name: Build aether core (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
            goarch: arm64
            goarm: ""
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
            goarch: arm
            goarm: "7"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # The engine source is fetched by EXACT commit hash from native/aether-core.pin
      # (no submodule setup needed on your side). GitHub serves any commit by SHA, and
      # the check below fails the build if what was fetched is not that exact commit.
      - name: Fetch aether-core at the pinned commit
        run: |
          set -e
          pin="$(tr -d '[:space:]' < native/aether-core.pin)"
          rm -rf native/aether-core
          mkdir -p native/aether-core
          git -C native/aether-core init -q
          git -C native/aether-core fetch -q --depth 1 https://github.com/CluvexStudio/Aether "$pin"
          git -C native/aether-core checkout -q FETCH_HEAD
          test "$(git -C native/aether-core rev-parse HEAD)" = "$pin"
          echo "aether-core @ $pin"

      # OPTIONAL core patch (off by default). Create the empty file native/aether-core-patches/health-interval/ENABLED
      # to apply it: it makes the WireGuard health probe interval configurable (AETHER_WG_HEALTH_SECS), which the
      # app's Battery saver sets to 10 s instead of the core's fixed 3 s. The script changes nothing and FAILS the
      # build unless the target text matches exactly once, so a changed pin is never patched blindly.
      - name: Apply optional core patch (health interval)
        run: |
          set -e
          if [ -f native/aether-core-patches/health-interval/ENABLED ]; then
            python3 native/aether-core-patches/health-interval/apply.py native/aether-core
            grep -q "AETHER_WG_HEALTH_SECS" native/aether-core/aether/src/wireguard.rs
          else
            echo "health-interval patch not enabled (no ENABLED file): building the pinned core unmodified"
          fi

      # The app drives the core purely through AETHER_* environment variables
      # (see EngineProcessManager.kt). If an upstream bump ever renames or
      # drops one of them, fail HERE with the missing name instead of
      # shipping an APK whose settings silently do nothing. Names verified
      # against Aether v2.3.0 (commit 6175b67) via the AetherGUI reference.
      - name: Verify the core still honors every env var the app sets
        run: |
          set -e
          SRC=native/aether-core/aether/src
          for v in AETHER_PROTOCOL AETHER_SCAN AETHER_IP AETHER_NOIZE AETHER_SOCKS \
                   AETHER_CONFIG AETHER_QUICK_RECONNECT AETHER_MASQUE_HTTP2 \
                   AETHER_GOOL_MODE AETHER_EXIT_LOC AETHER_ECH AETHER_DNS \
                   AETHER_ROUTES_FILE AETHER_TEAM AETHER_MASQUE_H2_FRAGMENT \
                   AETHER_MASQUE_MTU AETHER_ECH_DNS AETHER_EXIT_LOC_SECS \
                   AETHER_PSIPHON AETHER_PSIPHON_BIND AETHER_PSIPHON_MODE AETHER_PSIPHON_REGION \
                   AETHER_PSIPHON_DIR AETHER_PSIPHON_BIN AETHER_TOR AETHER_TOR_BIND \
                   AETHER_TOR_BRIDGES AETHER_TOR_DIR AETHER_PERF_PROFILE; do
            grep -rq "$v" "$SRC" || { echo "ERROR: core source no longer mentions $v"; exit 1; }
          done
          echo "OK: all AETHER_* variables the app sets exist in the pinned core"

      # Core v2.3.0 needs Rust 1.98 or newer. The exact version is pinned (1.98.1) so a new stable
      # release can never change what the build produces; raise it on purpose when the core needs it.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}

      # boring-sys (BoringSSL bindings, pulled in by quiche) needs Go to build
      # BoringSSL itself -- confirmed dependency, not optional.
      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.22"

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@a89e43e22a96abafcd7a62db652a65ecd33052c9 # v4.4.4
        with:
          cmakeVersion: 4.4.4

      # No separate system clang install here on purpose: the NDK ships its
      # own clang and cc-rs/bindgen use that automatically for Android
      # targets. (Contrast with a native Linux build, which does need a
      # system clang -- see upstream's Dockerfile.)
      - name: Install Android NDK
        id: ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        with:
          ndk-version: r26d

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      # ROOT CAUSE of the on-device error
      #   CANNOT LINK EXECUTABLE ... library "libc++_shared.so" not found
      # BoringSSL (pulled in by quiche) is C++, and cargo-ndk links the NDK's
      # libc++ as a SHARED library by default. The APK never contains
      # libc++_shared.so, so the engine process dies the instant Android tries
      # to start it and the app sits at "Connecting" until the timeout.
      # Upstream Aether's own release workflow avoids it by telling the boring
      # build to link libc++ statically; this is that exact line. The check
      # after the build then FAILS THE CI JOB if a shared libc++ ever sneaks
      # back in, so a broken APK can no longer be produced silently.
      - name: Build aether core
        working-directory: native/aether-core/aether
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -e
          under=$(echo "${{ matrix.target }}" | tr '-' '_')
          export "BORING_BSSL_RUST_CPPLIB_${under}=static:-bundle=c++"
          # --features tor builds the Tor client (arti) into the core, needed for WARP -> Tor.
          # This is the same command upstream's own Android release job runs.
          cargo ndk -t ${{ matrix.abi }} --platform 24 build --release --features tor
          bin="target/${{ matrix.target }}/release/aether"
          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          needed=$("$READELF" -d "$bin" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p')
          echo "[android ${{ matrix.abi }}] aether NEEDED: $needed"
          if grep -qx 'libc++_shared.so' <<<"$needed"; then
            echo "ERROR: aether still needs libc++_shared.so (static libc++ link failed)"; exit 1
          fi

      # Psiphon is a separate Go program the core launches for WARP -> Psiphon. It is built from
      # the exact fork + commit upstream pins in its own psiphon-build.sh (CGO off, so a static
      # linux ELF that runs as-is on Android, same as upstream's Android release job).
      - name: Build psiphon-tunnel-core
        run: |
          set -e
          bash native/aether-core/psiphon-build.sh linux "${{ matrix.goarch }}" "$PWD/psiphon-out" "${{ matrix.goarm }}"
          f=psiphon-out/psiphon-tunnel-core
          test -s "$f" || { echo "ERROR: psiphon binary missing"; exit 1; }
          READELF="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          "$READELF" -h "$f" | grep -E 'Class|Machine'
          if "$READELF" -d "$f" 2>/dev/null | grep -q '(NEEDED)'; then
            echo "ERROR: psiphon is dynamically linked; it would not start on Android"; exit 1
          fi
          echo "OK: psiphon-tunnel-core is a static ELF"

      - name: Rename to lib*.so (required for Android to extract+exec it) and stage
        run: |
          mkdir -p "staged/${{ matrix.abi }}"
          cp "native/aether-core/aether/target/${{ matrix.target }}/release/aether" \
             "staged/${{ matrix.abi }}/libaether.so"
          cp psiphon-out/psiphon-tunnel-core "staged/${{ matrix.abi }}/libpsiphon.so"

      - name: Upload aether binary for this ABI
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aether-${{ matrix.abi }}
          path: |
            staged/${{ matrix.abi }}/libaether.so
            staged/${{ matrix.abi }}/libpsiphon.so
          retention-days: 1

  build-native-tun2socks:
    name: Build hev-socks5-tunnel + our JNI bridge (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Same exact-commit fetch as for the engine. hev has its own submodules
      # (lwip, yaml, hev-task-system, hev-socks5-core) that its Android.mk needs,
      # so those are initialised too (each is pinned by hev's own commit).
      - name: Fetch hev-socks5-tunnel at the pinned commit
        run: |
          set -e
          pin="$(tr -d '[:space:]' < native/hev-socks5-tunnel.pin)"
          rm -rf native/hev-socks5-tunnel
          mkdir -p native/hev-socks5-tunnel
          git -C native/hev-socks5-tunnel init -q
          git -C native/hev-socks5-tunnel fetch -q --depth 1 https://github.com/heiher/hev-socks5-tunnel "$pin"
          git -C native/hev-socks5-tunnel checkout -q FETCH_HEAD
          test "$(git -C native/hev-socks5-tunnel rev-parse HEAD)" = "$pin"
          git -C native/hev-socks5-tunnel submodule update --init --recursive --depth 1
          echo "hev-socks5-tunnel @ $pin"

      - name: Install Android NDK
        id: ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        with:
          ndk-version: r26d

      # This whole job's structure is cross-checked against a reference app
      # that documented (in its own commit history / SECURITY_AUDIT docs) a
      # real, field-hit crash class: loading hev-socks5-tunnel directly and
      # trusting its BUNDLED JNI layer (hev-jni.c) crashes full VPN mode
      # whenever upstream's JNI signatures drift, while proxy-only mode (which
      # never touches hev) keeps working -- exactly the symptom reported here.
      # Fix: strip hev's own JNI layer out of the build entirely, and ship our
      # own tiny bridge (scripts/aethertun-jni.c) that binds only hev's STABLE
      # public C API and exports Java_* symbols we control.
      - name: Strip hev's bundled JNI layer out of the build
        run: |
          set -e
          find native/hev-socks5-tunnel -name '*.mk' -print0 \
            | xargs -0 sed -i 's|[^[:space:]]*hev-jni\.c||g'
          find native/hev-socks5-tunnel -name 'hev-jni.c' -delete

      - name: Locate Android.mk
        id: mk
        run: |
          set -e
          if [ -f native/hev-socks5-tunnel/Android.mk ]; then
            echo "dir=native/hev-socks5-tunnel" >> "$GITHUB_OUTPUT"
          elif [ -f native/hev-socks5-tunnel/jni/Android.mk ]; then
            echo "dir=native/hev-socks5-tunnel/jni" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: Android.mk not found at repo root or jni/" >&2
            exit 1
          fi

      - name: Build hev-socks5-tunnel core (without its JNI layer)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -e
          MK_DIR="${{ steps.mk.outputs.dir }}"
          APP_MK_FLAG=""
          [ -f "${MK_DIR}/Application.mk" ] && APP_MK_FLAG="NDK_APPLICATION_MK=${MK_DIR}/Application.mk"
          "$ANDROID_NDK_HOME/ndk-build" \
            NDK_PROJECT_PATH=native/hev-socks5-tunnel \
            APP_BUILD_SCRIPT="${MK_DIR}/Android.mk" \
            ${APP_MK_FLAG} \
            APP_ABI=${{ matrix.abi }} \
            APP_PLATFORM=android-26 \
            APP_STL=c++_static \
            APP_CFLAGS=-O3

      - name: Verify hev exports its stable C API and NOT a JNI layer
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -e
          SO="native/hev-socks5-tunnel/libs/${{ matrix.abi }}/libhev-socks5-tunnel.so"
          test -f "$SO" || { echo "ERROR: $SO not produced"; exit 1; }
          NM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          SYMS="$("$NM" --dynamic --defined-only "$SO")"
          for sym in hev_socks5_tunnel_main hev_socks5_tunnel_quit hev_socks5_tunnel_stats; do
            echo "$SYMS" | grep -qw "$sym" || { echo "ERROR: $SO missing $sym"; exit 1; }
          done
          # If hev-jni.c wasn't fully stripped, JNI_OnLoad would still be
          # exported -- ART's dlsym() search of DT_NEEDED deps would find it
          # and run its (potentially signature-drifted) RegisterNatives again.
          if echo "$SYMS" | grep -qw JNI_OnLoad; then
            echo "ERROR: hev still exports JNI_OnLoad -- strip step did not work for this upstream layout"
            exit 1
          fi
          echo "OK: hev exports the stable C API and nothing JNI-related"

      - name: Build our own JNI bridge (libaethertun.so)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -e
          case "${{ matrix.abi }}" in
            arm64-v8a)   CLANG="aarch64-linux-android26-clang" ;;
            armeabi-v7a) CLANG="armv7a-linux-androideabi26-clang" ;;
          esac
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          LIBDIR="native/hev-socks5-tunnel/libs/${{ matrix.abi }}"
          "$TOOLCHAIN/$CLANG" -O2 -fPIC -shared -Wall -Werror \
            -Wl,-soname,libaethertun.so -Wl,--no-undefined \
            -o "$LIBDIR/libaethertun.so" scripts/aethertun-jni.c \
            -L"$LIBDIR" -lhev-socks5-tunnel -llog

      - name: Verify the bridge exports the exact symbols Kotlin expects
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -e
          SO="native/hev-socks5-tunnel/libs/${{ matrix.abi }}/libaethertun.so"
          NM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          SYMS="$("$NM" --dynamic --defined-only "$SO")"
          for sym in \
            JNI_OnLoad \
            Java_com_aethershield_app_vpn_TProxyService_TProxyStartService \
            Java_com_aethershield_app_vpn_TProxyService_TProxyStopService \
            Java_com_aethershield_app_vpn_TProxyService_TProxyIsRunning \
            Java_com_aethershield_app_vpn_TProxyService_TProxyGetStats; do
            echo "$SYMS" | grep -qw "$sym" || { echo "ERROR: $SO missing $sym -- Kotlin externals would not resolve"; exit 1; }
          done
          echo "OK: libaethertun.so exports all Java_* symbols TProxyService.kt declares"
          # Same trap as the engine: no native library we ship may depend on a
          # shared libc++ the APK does not contain.
          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for lib in libaethertun.so libhev-socks5-tunnel.so; do
            F="native/hev-socks5-tunnel/libs/${{ matrix.abi }}/$lib"
            if "$READELF" -d "$F" | grep -q 'libc++_shared.so'; then
              echo "ERROR: $lib needs libc++_shared.so, which is not packaged"; exit 1
            fi
          done
          echo "OK: tun2socks libraries do not need libc++_shared.so"

      - name: Stage both libraries
        run: |
          set -e
          mkdir -p staged/${{ matrix.abi }}
          cp "native/hev-socks5-tunnel/libs/${{ matrix.abi }}/libhev-socks5-tunnel.so" staged/${{ matrix.abi }}/
          cp "native/hev-socks5-tunnel/libs/${{ matrix.abi }}/libaethertun.so" staged/${{ matrix.abi }}/

      - name: Upload native libs for this ABI
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tun2socks-${{ matrix.abi }}
          path: staged/${{ matrix.abi }}/*.so
          retention-days: 1

  build-apk:
    needs: [build-native-aether, build-native-tun2socks]
    runs-on: ubuntu-latest
    # Read-only. This job holds the signing key, so it must not be able to publish or write anything.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download all native artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist-native

      - name: Assemble jniLibs/<abi>/ from the downloaded artifacts
        run: |
          set -e
          mkdir -p app/src/main/jniLibs
          for abi in arm64-v8a armeabi-v7a; do
            mkdir -p "app/src/main/jniLibs/$abi"
            cp "dist-native/aether-$abi/libaether.so" "app/src/main/jniLibs/$abi/"
            cp "dist-native/aether-$abi/libpsiphon.so" "app/src/main/jniLibs/$abi/"
            cp "dist-native/tun2socks-$abi/libhev-socks5-tunnel.so" "app/src/main/jniLibs/$abi/"
            cp "dist-native/tun2socks-$abi/libaethertun.so" "app/src/main/jniLibs/$abi/"
          done

      # The app compares these at engine start (core/BinaryIntegrity.kt, EngineProcessManager).
      # One line per file: <abi>/<file>=<sha256>. It covers every native file we ship, including
      # libpsiphon.so. gradle keeps the .so bytes untouched (keepDebugSymbols), and the step after
      # the build proves that against the finished APK.
      - name: Stamp native hashes into the app
        run: |
          set -e
          mkdir -p app/src/main/assets
          out=app/src/main/assets/native_hashes.properties
          echo "# generated by CI, do not edit" > "$out"
          for abi in arm64-v8a armeabi-v7a; do
            for f in libaether.so libpsiphon.so libhev-socks5-tunnel.so libaethertun.so; do
              echo "$abi/$f=$(sha256sum "app/src/main/jniLibs/$abi/$f" | cut -d' ' -f1)" >> "$out"
            done
          done
          cat "$out"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      # No gradlew/gradle-wrapper.jar in this repo, so the setup-gradle action installs a real
      # Gradle distribution. The version is pinned.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: 8.9

      - name: Decode signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEY_BASE64" ]; then
            echo "$SIGNING_KEY_BASE64" | base64 -d > release.keystore
            chmod 600 release.keystore
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease

      # The signing key is not needed after the build: remove it even if the build failed.
      - name: Remove signing key
        if: always()
        run: rm -f release.keystore

      # Fails the build (so it never ships) if the native files inside the finished APK are not
      # byte-identical to the stamped hashes. That would make the on-device check reject a good install.
      - name: Verify the APK carries exactly the stamped native files
        run: |
          set -e
          apk="$(ls app/build/outputs/apk/release/*.apk | head -n1)"
          echo "checking $apk"
          while IFS='=' read -r key hash; do
            case "$key" in ''|\#*) continue;; esac
            got="$(unzip -p "$apk" "lib/$key" | sha256sum | cut -d' ' -f1)"
            if [ "$got" != "$hash" ]; then
              echo "ERROR: lib/$key in the APK differs from the stamped hash"; exit 1
            fi
          done < app/src/main/assets/native_hashes.properties
          echo "OK: every stamped native file is byte-identical inside the APK"

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MadShield-release
          path: app/build/outputs/apk/release/*.apk

  # Publishing is a separate job on purpose: it is the only one allowed to write to the repository,
  # and it never sees the signing key or the source tree, only the finished APK.
  release:
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - name: Download the APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: MadShield-release
          path: release-apk

      # Each build gets its own tag (the run number), so nothing collides or overwrites an older release;
      # "make_latest" keeps the newest one marked Latest.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ github.run_number }}
