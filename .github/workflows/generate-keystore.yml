name: Generate Signing Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate random password
        id: pass
        run: |
          PASS=$(openssl rand -base64 18)
          echo "::add-mask::$PASS"
          echo "pass=$PASS" >> "$GITHUB_OUTPUT"

      - name: Create keystore
        env:
          PASS: ${{ steps.pass.outputs.pass }}
        run: |
          keytool -genkey -v -keystore aethershield.keystore -alias aethershield \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=AetherShield, OU=App, O=AetherShield, L=City, S=State, C=US"

      - name: Set repository secrets automatically
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PASS: ${{ steps.pass.outputs.pass }}
        run: |
          KEYSTORE_B64=$(base64 -w 0 aethershield.keystore)
          gh secret set SIGNING_KEY_BASE64 --repo "${{ github.repository }}" --body "$KEYSTORE_B64"
          gh secret set KEYSTORE_PASSWORD --repo "${{ github.repository }}" --body "$PASS"
          gh secret set KEY_ALIAS --repo "${{ github.repository }}" --body "aethershield"
          gh secret set KEY_PASSWORD --repo "${{ github.repository }}" --body "$PASS"
          echo "چهار تا secret با موفقیت ثبت شدن."
